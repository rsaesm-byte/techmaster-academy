# Roda em todo pull request: nada entra na main sem passar.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatação
        run: npm run format:check
      - name: Tipos (TypeScript)
        run: npm run typecheck
      - name: Testes
        run: npm test
